<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e8e9e7" />
    <title>SWUI / Liquid Glass</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --page: #e4e6e3;
        --canvas: #e8e9e7;
        --ink: #151515;
        --line: rgba(21, 21, 21, 0.12);
        --glass: rgba(255, 255, 255, 0.40);
        --glass-strong: rgba(255, 255, 255, 0.58);
        --glass-border: rgba(255, 255, 255, 0.88);
        --glass-highlight: rgba(255, 255, 255, 0.96);
        --glass-shadow: 0 7px 18px rgba(21, 21, 21, 0.09);
        --green: #14d878;
        --blue: #4aa4ee;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        overflow-x: hidden;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      }

      button {
        color: inherit;
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 4px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .demo {
        position: relative;
        isolation: isolate;
        width: min(calc(100% - 28px), 820px);
        padding: 14px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.86);
        border-radius: 32px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.32));
        -webkit-backdrop-filter: blur(28px) saturate(175%);
        backdrop-filter: blur(28px) saturate(175%);
        box-shadow:
          inset 0 1px 0 var(--glass-highlight),
          inset 0 -1px 0 rgba(56, 61, 58, 0.12),
          0 24px 48px rgba(21, 21, 21, 0.12);
      }

      .demo::before {
        position: absolute;
        inset: 1px 1px auto;
        height: 46%;
        border-radius: 33px 33px 50% 50%;
        background: linear-gradient(118deg, rgba(255, 255, 255, 0.32), transparent 58%);
        content: "";
        pointer-events: none;
      }

      .canvas {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: clamp(360px, 68svh, 620px);
        place-items: center;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: linear-gradient(145deg, rgba(244, 246, 242, 0.65), rgba(226, 230, 228, 0.54));
        -webkit-backdrop-filter: blur(20px) saturate(170%);
        backdrop-filter: blur(20px) saturate(170%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.72), inset 0 -1px 0 rgba(58, 63, 60, 0.10);
      }

      .canvas::before,
      .canvas::after {
        position: absolute;
        width: 290px;
        height: 290px;
        border-radius: 50%;
        content: "";
        filter: blur(58px);
        opacity: 0.38;
        pointer-events: none;
      }

      .canvas::before {
        top: -154px;
        left: -126px;
        background: rgba(76, 215, 153, 0.38);
      }

      .canvas::after {
        right: -126px;
        bottom: -154px;
        background: rgba(74, 164, 238, 0.26);
      }

      .action-rail {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        max-width: 100%;
        padding: 20px;
        transform-origin: center;
      }

      .action {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 56px;
        padding: 0 18px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.92);
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0.48));
        color: var(--ink);
        cursor: pointer;
        -webkit-backdrop-filter: blur(22px) saturate(185%);
        backdrop-filter: blur(22px) saturate(185%);
        box-shadow:
          inset 0 1px 0 var(--glass-highlight),
          inset 0 -1px 0 rgba(57, 62, 59, 0.12),
          var(--glass-shadow);
        font-size: 17px;
        font-weight: 650;
        line-height: 1;
        white-space: nowrap;
        transition: transform 170ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 180ms ease;
      }

      .action::before {
        position: absolute;
        inset: 1px 1px auto;
        height: 52%;
        border-radius: inherit;
        background: linear-gradient(118deg, rgba(255, 255, 255, 0.34), transparent 64%);
        content: "";
        pointer-events: none;
      }

      .action:hover {
        box-shadow: inset 0 1px 0 var(--glass-highlight), 0 12px 26px rgba(21, 21, 21, 0.16);
      }

      .action:active {
        transform: scale(0.96);
      }

      .action > * {
        position: relative;
        z-index: 1;
      }

      .action-icon {
        display: inline-grid;
        width: 23px;
        height: 23px;
        place-items: center;
        font-size: 22px;
      }

      .action-close {
        width: 56px;
        padding: 0;
      }

      .action-close .action-icon {
        font-size: 21px;
      }

      .action-payment {
        padding-left: 5px;
        padding-right: 18px;
      }

      .action-payment .action-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-size: 21px;
      }

      .action-pay .action-icon {
        background: var(--green);
      }

      .action-request .action-icon {
        background: var(--blue);
      }

      @media (max-width: 560px) {
        .demo {
          width: min(calc(100% - 18px), 820px);
          padding: 10px;
          border-radius: 22px;
        }

        .canvas {
          min-height: 0;
          aspect-ratio: 1.165 / 1;
          border-radius: 19px;
        }

        .action-rail {
          gap: 7px;
          padding: 12px;
        }

        .action {
          min-height: 44px;
          gap: 7px;
          padding: 0 6px;
          font-size: 16px;
        }

        .action-icon {
          width: 19px;
          height: 19px;
          font-size: 19px;
        }

        .action-close {
          width: 46px;
        }

        .action-close .action-icon {
          font-size: 20px;
        }

        .action-payment {
          padding-left: 4px;
          padding-right: 9px;
        }

        .action-payment .action-icon {
          width: 36px;
          height: 36px;
          font-size: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .demo,
        .action {
          background: #f8f8f6;
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
          box-shadow: 0 8px 20px rgba(21, 21, 21, 0.08);
        }

        .demo::before,
        .action::before,
        .canvas::before,
        .canvas::after {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="demo" aria-label="SWUI Liquid Glass contextual action split">
      <div class="canvas">
        <div class="action-rail" id="actionRail" aria-live="polite" aria-label="Contextual actions"></div>
      </div>
    </main>

    <script>
      const states = {
        discover: {
          actions: [
            { id: "contact", label: "Contact", icon: "ph-user-circle", className: "" },
            { id: "scan", label: "Scan QR", icon: "ph-qr-code", className: "" },
            { id: "close", label: "Close", icon: "ph-x", className: "action-close" }
          ]
        },
        qr: {
          actions: [
            { id: "close", label: "Close", icon: "ph-x", className: "action-close" },
            { id: "contact", label: "Contact", icon: "ph-user-circle", className: "" },
            { id: "my-qr", label: "My QR", icon: "ph-qr-code", className: "" }
          ]
        },
        payment: {
          actions: [
            { id: "pay", label: "Pay", icon: "ph-arrow-up-right", className: "action-payment action-pay" },
            { id: "request", label: "Request", icon: "ph-arrow-down-left", className: "action-payment action-request" }
          ]
        }
      };

      const rail = document.querySelector("#actionRail");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let currentState = "qr";
      let activeTimeline = null;

      function actionMarkup(action) {
        const icon = action.className.includes("action-payment")
          ? '<span class="action-icon"><i class="ph ' + action.icon + '" aria-hidden="true"></i></span>'
          : '<i class="action-icon ph ' + action.icon + '" aria-hidden="true"></i>';
        const label = action.className.includes("action-close")
          ? '<span class="sr-only">' + action.label + "</span>"
          : action.label;

        return '<button class="action ' + action.className + '" data-action="' + action.id + '" type="button" aria-label="' + action.label + '">' + icon + label + "</button>";
      }

      function drawState() {
        const state = states[currentState];
        rail.innerHTML = state.actions.map(actionMarkup).join("");
      }

      function nextForAction(actionId) {
        if (actionId === "scan") return "qr";
        if (actionId === "my-qr") return "payment";
        if (actionId === "contact") return currentState === "discover" ? "qr" : "discover";
        if (actionId === "pay" || actionId === "request" || actionId === "close") return "discover";
        return currentState;
      }

      function goTo(nextState) {
        if (nextState === currentState) return;

        if (activeTimeline) activeTimeline.kill();

        const outgoing = [...rail.children];
        const useMotion = !reducedMotion.matches && window.gsap;

        if (!useMotion) {
          currentState = nextState;
          drawState();
          return;
        }

        activeTimeline = gsap.timeline({
          onComplete: () => {
            activeTimeline = null;
          }
        });

        activeTimeline
          .to(outgoing, {
            y: 10,
            autoAlpha: 0,
            scale: 0.92,
            duration: 0.18,
            stagger: 0.025,
            ease: "power2.in"
          })
          .call(() => {
            currentState = nextState;
            drawState();
            gsap.fromTo(
              [...rail.children],
              { y: -10, autoAlpha: 0, scale: 0.92 },
              {
                y: 0,
                autoAlpha: 1,
                scale: 1,
                duration: 0.48,
                stagger: 0.04,
                ease: "back.out(1.16)"
              }
            );
          });
      }

      rail.addEventListener("click", event => {
        const action = event.target.closest(".action");
        if (!action) return;
        goTo(nextForAction(action.dataset.action));
      });

      drawState();
    </script>
  </body>
</html>
