<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e8e9e7" />
    <title>SWUI / Liquid Glass</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <script src="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --page: #e2e4e1;
        --canvas: #e9e9e7;
        --ink: #151515;
        --muted: rgba(21, 21, 21, 0.52);
        --line: rgba(21, 21, 21, 0.12);
        --glass: rgba(255, 255, 255, 0.44);
        --glass-strong: rgba(255, 255, 255, 0.62);
        --glass-border: rgba(255, 255, 255, 0.78);
        --glass-highlight: rgba(255, 255, 255, 0.94);
        --glass-shadow: 0 18px 38px rgba(21, 21, 21, 0.12);
        --green: #14d878;
        --blue: #4aa4ee;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        overflow-x: hidden;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      }

      button {
        color: inherit;
        font: inherit;
        -webkit-tap-highlight-color: transparent;
      }

      :focus-visible {
        outline: 3px solid var(--blue);
        outline-offset: 4px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .demo {
        position: relative;
        isolation: isolate;
        width: min(calc(100% - 32px), 820px);
        padding: 14px;
        overflow: hidden;
        border: 1px solid var(--glass-border);
        border-radius: 34px;
        background: var(--glass);
        -webkit-backdrop-filter: blur(28px) saturate(175%);
        backdrop-filter: blur(28px) saturate(175%);
        box-shadow: inset 0 1px 0 var(--glass-highlight), 0 30px 70px rgba(21, 21, 21, 0.14);
      }

      .demo::before {
        position: absolute;
        inset: 1px 1px auto;
        height: 46%;
        border-radius: 33px 33px 50% 50%;
        background: linear-gradient(118deg, rgba(255, 255, 255, 0.32), transparent 58%);
        content: "";
        pointer-events: none;
      }

      .canvas {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: clamp(360px, 68svh, 620px);
        place-items: center;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: var(--canvas);
      }

      .canvas::before,
      .canvas::after {
        position: absolute;
        width: 230px;
        height: 230px;
        border-radius: 50%;
        content: "";
        filter: blur(38px);
        opacity: 0.46;
        pointer-events: none;
      }

      .canvas::before {
        top: -120px;
        left: -86px;
        background: rgba(20, 216, 120, 0.34);
      }

      .canvas::after {
        right: -86px;
        bottom: -122px;
        background: rgba(74, 164, 238, 0.28);
      }

      .action-rail {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        max-width: 100%;
        padding: 20px;
        transform-origin: center;
      }

      .action {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 56px;
        padding: 0 18px;
        overflow: hidden;
        border: 1px solid var(--glass-border);
        border-radius: 999px;
        background: var(--glass-strong);
        color: var(--ink);
        cursor: pointer;
        -webkit-backdrop-filter: blur(22px) saturate(185%);
        backdrop-filter: blur(22px) saturate(185%);
        box-shadow: inset 0 1px 0 var(--glass-highlight), var(--glass-shadow);
        font-size: 17px;
        font-weight: 650;
        line-height: 1;
        white-space: nowrap;
        transition: transform 150ms ease, box-shadow 180ms ease;
      }

      .action::before {
        position: absolute;
        inset: 1px 1px auto;
        height: 52%;
        border-radius: inherit;
        background: linear-gradient(118deg, rgba(255, 255, 255, 0.34), transparent 64%);
        content: "";
        pointer-events: none;
      }

      .action:hover {
        box-shadow: inset 0 1px 0 var(--glass-highlight), 0 12px 26px rgba(21, 21, 21, 0.16);
      }

      .action:active {
        transform: scale(0.96);
      }

      .action > * {
        position: relative;
        z-index: 1;
      }

      .action-icon {
        display: inline-grid;
        width: 23px;
        height: 23px;
        place-items: center;
        font-size: 22px;
      }

      .action-close {
        width: 56px;
        padding: 0;
      }

      .action-close .action-icon {
        font-size: 21px;
      }

      .action-payment {
        padding-left: 5px;
        padding-right: 18px;
      }

      .action-payment .action-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        font-size: 21px;
      }

      .action-pay .action-icon {
        background: var(--green);
      }

      .action-request .action-icon {
        background: var(--blue);
      }

      .demo-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 6px 2px 8px;
      }

      .context {
        min-width: 0;
      }

      .context-label {
        display: block;
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 12px;
      }

      .context-name {
        display: block;
        font-size: 15px;
        font-weight: 650;
      }

      .phase-dots {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .phase-dot {
        width: 8px;
        height: 8px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(21, 21, 21, 0.2);
        cursor: pointer;
        transition: transform 180ms ease, background-color 180ms ease;
      }

      .phase-dot[aria-selected="true"] {
        transform: scale(1.45);
        background: var(--ink);
      }

      @media (max-width: 560px) {
        .demo {
          width: min(calc(100% - 20px), 820px);
          padding: 10px;
          border-radius: 27px;
        }

        .canvas {
          min-height: 330px;
          border-radius: 21px;
        }

        .action-rail {
          gap: 8px;
          padding: 12px;
        }

        .action {
          min-height: 48px;
          gap: 7px;
          padding: 0 13px;
          font-size: 14px;
        }

        .action-icon {
          width: 19px;
          height: 19px;
          font-size: 18px;
        }

        .action-close {
          width: 48px;
        }

        .action-payment {
          padding-left: 4px;
          padding-right: 13px;
        }

        .action-payment .action-icon {
          width: 38px;
          height: 38px;
          font-size: 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .demo,
        .action {
          background: #f8f8f6;
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
          box-shadow: 0 8px 20px rgba(21, 21, 21, 0.08);
        }

        .demo::before,
        .action::before,
        .canvas::before,
        .canvas::after {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="demo" aria-label="SWUI Liquid Glass contextual action split">
      <div class="canvas">
        <div class="action-rail" id="actionRail" aria-live="polite" aria-label="Contextual actions"></div>
      </div>
      <div class="demo-footer">
        <div class="context">
          <span class="context-label">Current context</span>
          <strong class="context-name" id="contextName">Discover</strong>
        </div>
        <div class="phase-dots" role="tablist" aria-label="Choose a context">
          <button class="phase-dot" data-state="discover" role="tab" aria-label="Discover context" aria-selected="true"></button>
          <button class="phase-dot" data-state="qr" role="tab" aria-label="My QR context" aria-selected="false"></button>
          <button class="phase-dot" data-state="payment" role="tab" aria-label="Payment context" aria-selected="false"></button>
        </div>
      </div>
    </main>

    <script>
      const states = {
        discover: {
          label: "Discover",
          actions: [
            { id: "contact", label: "Contact", icon: "ph-user-circle", className: "" },
            { id: "scan", label: "Scan QR", icon: "ph-qr-code", className: "" },
            { id: "close", label: "Close", icon: "ph-x", className: "action-close" }
          ]
        },
        qr: {
          label: "My QR",
          actions: [
            { id: "close", label: "Close", icon: "ph-x", className: "action-close" },
            { id: "contact", label: "Contact", icon: "ph-user-circle", className: "" },
            { id: "my-qr", label: "My QR", icon: "ph-qr-code", className: "" }
          ]
        },
        payment: {
          label: "Payment",
          actions: [
            { id: "pay", label: "Pay", icon: "ph-arrow-up-right", className: "action-payment action-pay" },
            { id: "request", label: "Request", icon: "ph-arrow-down-left", className: "action-payment action-request" }
          ]
        }
      };

      const rail = document.querySelector("#actionRail");
      const contextName = document.querySelector("#contextName");
      const dots = [...document.querySelectorAll(".phase-dot")];
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let currentState = "discover";
      let activeTimeline = null;

      function actionMarkup(action) {
        const icon = action.className.includes("action-payment")
          ? '<span class="action-icon"><i class="ph ' + action.icon + '" aria-hidden="true"></i></span>'
          : '<i class="action-icon ph ' + action.icon + '" aria-hidden="true"></i>';
        const label = action.className.includes("action-close")
          ? '<span class="sr-only">' + action.label + "</span>"
          : action.label;

        return '<button class="action ' + action.className + '" data-action="' + action.id + '" type="button" aria-label="' + action.label + '">' + icon + label + "</button>";
      }

      function drawState() {
        const state = states[currentState];
        rail.innerHTML = state.actions.map(actionMarkup).join("");
        contextName.textContent = state.label;
        dots.forEach(dot => {
          dot.setAttribute("aria-selected", String(dot.dataset.state === currentState));
        });
      }

      function nextForAction(actionId) {
        if (actionId === "scan") return "qr";
        if (actionId === "my-qr") return "payment";
        if (actionId === "contact") return currentState === "discover" ? "qr" : "discover";
        if (actionId === "pay" || actionId === "request" || actionId === "close") return "discover";
        return currentState;
      }

      function goTo(nextState) {
        if (nextState === currentState) return;

        if (activeTimeline) activeTimeline.kill();

        const outgoing = [...rail.children];
        const useMotion = !reducedMotion.matches && window.gsap;

        if (!useMotion) {
          currentState = nextState;
          drawState();
          return;
        }

        activeTimeline = gsap.timeline({
          onComplete: () => {
            activeTimeline = null;
          }
        });

        activeTimeline
          .to(outgoing, {
            y: 10,
            autoAlpha: 0,
            scale: 0.92,
            duration: 0.18,
            stagger: 0.025,
            ease: "power2.in"
          })
          .call(() => {
            currentState = nextState;
            drawState();
            gsap.fromTo(
              [...rail.children],
              { y: -10, autoAlpha: 0, scale: 0.92 },
              {
                y: 0,
                autoAlpha: 1,
                scale: 1,
                duration: 0.48,
                stagger: 0.04,
                ease: "back.out(1.16)"
              }
            );
          });
      }

      rail.addEventListener("click", event => {
        const action = event.target.closest(".action");
        if (!action) return;
        goTo(nextForAction(action.dataset.action));
      });

      dots.forEach(dot => {
        dot.addEventListener("click", () => goTo(dot.dataset.state));
      });

      drawState();
    </script>
  </body>
</html>
